# LSB test server for LSM addon / event-system testing.
#
# Adapted from the example in docker/README.md. Uses the prebuilt public image, so
# nothing is compiled on the droplet.
#
# First-time setup:
#   git submodule update --init --depth 1     # navmeshes, losmeshes, ximeshes
#   docker compose up -d
#
# NOTE: meshes are bind-mounted from the repo's own submodules rather than taken from
# the ghcr.io/landsandboat/ximeshes image that docker/README.md suggests. That image
# ships navmeshes and ximeshes but NO losmeshes, and the README's command does not
# mount ximeshes at all -- so zone.cpp would fail to find ximeshes/<zone>.ximesh and
# losmeshes/<zone>.obj (line of sight).
#
# This file is gitignored (.gitignore line 241), so it will not dirty the branch.

x-dbcreds: &dbcreds
  MARIADB_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD:?set this in .env}'
  MARIADB_DATABASE: xidb
  MARIADB_USER: xiadmin
  MARIADB_PASSWORD: '${MARIADB_PASSWORD:?set this in .env}'

x-common: &common
  image: ghcr.io/landsandboat/server:latest
  environment:
    <<: *dbcreds
    XI_NETWORK_ZMQ_IP: world
    XI_NETWORK_SQL_HOST: database
    # Accept any client version. The published image expects CLIENT_VER 30260805_0 with
    # VER_LOCK 2 (equal or newer), which rejects a retail client with FFXI-3331 "The
    # game's data has been updated". This is a test server for a fixed group, so drop
    # the check rather than force everyone to update their client.
    XI_LOGIN_VER_LOCK: 0
  volumes:
    - ./navmeshes:/server/navmeshes
    - ./losmeshes:/server/losmeshes
    - ./ximeshes:/server/ximeshes
    # Mount ONLY our own module files, NOT the whole modules/ directory. The image is
    # built from upstream's latest commit and ships its own module_utils.lua, which
    # defines xi.module.registry; mounting this fork's older modules/ tree over it makes
    # the loader fail with "attempt to get length of field 'registry'" and silently load
    # nothing. claim_shield.lua and test_npcs_in_gm_home.lua already exist in the image.
    - ./modules/init.txt:/server/modules/init.txt:ro
    - ./modules/custom/lua/lsm_test_spawn_announce.lua:/server/modules/custom/lua/lsm_test_spawn_announce.lua:ro
    - ./modules/custom/lua/lsm_test_claimshield_hnm.lua:/server/modules/custom/lua/lsm_test_claimshield_hnm.lua:ro
    # NOTE: do NOT mount tools/config.yaml from this repo; it carries a Windows
    # mysql_bin path that is wrong inside the container.

services:
  database:
    image: mariadb:lts
    restart: unless-stopped
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_general_ci']
    environment:
      <<: *dbcreds
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  # Imports/migrates the database, then exits. The other services wait for it.
  database-update:
    <<: *common
    command: ["python", "/server/tools/dbtool.py", "update"]
    depends_on:
      database:
        condition: service_healthy

  # dbtool's update re-imports zone_settings.sql, which resets zoneip to 127.0.0.1 and
  # leaves every client hung at "Downloading data...". zone_settings.sql is NOT in
  # dbtool's protected player_data list, so this happens on every `docker compose up`.
  # Re-apply the real address here so it cannot be silently undone again.
  zoneip:
    image: mariadb:lts
    environment:
      <<: *dbcreds
      SERVER_IP: ${SERVER_IP:?set SERVER_IP in .env}
    command:
      - sh
      - -c
      - mariadb -h database -u root -p"$$MARIADB_ROOT_PASSWORD" xidb -e "UPDATE zone_settings SET zoneip = '$$SERVER_IP';"
    depends_on:
      database:
        condition: service_healthy
      database-update:
        condition: service_completed_successfully

  connect:
    <<: *common
    command: ["/server/xi_connect"]
    restart: unless-stopped
    ports:
      - "54001:54001"   # login view / lobby
      - "54230:54230"   # login data (TCP)
      - "54231:54231"   # login auth
    depends_on:
      database:
        condition: service_healthy
        restart: true
      database-update:
        condition: service_completed_successfully
      zoneip:
        condition: service_completed_successfully

  search:
    <<: *common
    command: ["/server/xi_search"]
    restart: unless-stopped
    ports:
      - "54002:54002"
    depends_on:
      database:
        condition: service_healthy
        restart: true
      database-update:
        condition: service_completed_successfully
      zoneip:
        condition: service_completed_successfully

  # NOTE: port 8088 (the HTTP API) is deliberately NOT published. It has no auth and
  # no TLS. Leave it internal.
  world:
    <<: *common
    command: ["/server/xi_world"]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
        restart: true
      database-update:
        condition: service_completed_successfully
      zoneip:
        condition: service_completed_successfully

  map:
    <<: *common
    command: ["/server/xi_map"]
    restart: unless-stopped
    ports:
      - "54230:54230/udp"   # map traffic (UDP)
    depends_on:
      database:
        condition: service_healthy
        restart: true
      database-update:
        condition: service_completed_successfully
      zoneip:
        condition: service_completed_successfully
      world:
        condition: service_started

volumes:
  database:
